<text x="106.00" y="34.00" font-family="Segoe UI,Arial,Helvetica" font-size="3.0" fill="#15181b" text-anchor="start" font-weight="bold">What the sheet gives</text>
<text x="106.00" y="40.00" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">· Rear bedroom 4100 (printed) × 3560 outer, lọt lòng</text>
<text x="106.00" y="44.20" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   ~4000 × 3560 ≈ 13.9 m²  (the larger of the two</text>
<text x="106.00" y="48.40" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   bedrooms: the front one is 4000 deep).</text>
<text x="106.00" y="52.60" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">· Entry door 900 from the lobby, front-west.</text>
<text x="106.00" y="56.80" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">· WC 2200 × 1600 at the rear-west — its door opens</text>
<text x="106.00" y="61.00" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   into the bedroom.</text>
<text x="106.00" y="65.20" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">· LÔ GIA 1660 × 1600 at the rear-east, open — the</text>
<text x="106.00" y="69.40" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   room's ONLY daylight and air, reached by a 900 door.</text>
<text x="106.00" y="73.60" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">· Wardrobe wall on the east; bed head on the WC wall.</text>
<text x="106.00" y="80.80" font-family="Segoe UI,Arial,Helvetica" font-size="3.0" fill="#15181b" text-anchor="start" font-weight="bold">What that means for any split</text>
<text x="106.00" y="86.80" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">· Daylight is a single resource at one corner: a</text>
<text x="106.00" y="91.00" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   workspace only works if it takes the rear-east,</text>
<text x="106.00" y="95.20" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   otherwise it is a dark box or needs borrowed light.</text>
<text x="106.00" y="99.40" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">· The WC door sits on the rear wall, so it lands in</text>
<text x="106.00" y="103.60" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   whichever zone touches that wall.</text>
<text x="106.00" y="107.80" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">· Practical band for a new partition: 1500–1900 from</text>
<text x="106.00" y="112.00" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   the rear wall, or a front-to-rear side partition.</text>
<text x="106.00" y="116.20" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">· No second window is available: both side walls are</text>
<text x="106.00" y="120.40" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   party walls shared with the neighbours.</text>
<rect x="106.00" y="126.60" width="300.00" height="26.00" fill="#fff6ef" stroke="#f0c3a1" stroke-width="0.3"/>
<text x="109.00" y="132.60" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#b34700" text-anchor="start" font-weight="bold">MODEL vs SHEET — designs/contractor-as-drawn.json has the last two</text>
<text x="109.00" y="137.20" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#b34700" text-anchor="start" font-weight="normal">rear bands the other way round: it puts the 1600 WC band IN FRONT of the</text>
<text x="109.00" y="141.80" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#b34700" text-anchor="start" font-weight="normal">bedroom and gives the bedroom the rear wall with a 1500 window. The sheet</text>
<text x="109.00" y="146.40" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#b34700" text-anchor="start" font-weight="normal">reads 1600 first from the rear (WC+LÔ GIA), then 4100. Worth confirming.</text>
<text x="12.00" y="192.00" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">This sheet is the base for the four split options; all four keep the WC, the lô gia and the entry door where the drawing puts them.</text>
</svg>
