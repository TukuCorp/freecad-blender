<text x="55.84" y="146.25" font-family="Segoe UI,Arial,Helvetica" font-size="1.9" fill="#6b7280" text-anchor="middle" font-weight="normal">3560</text>
<line x1="96.00" y1="26.00" x2="96.00" y2="176.00" stroke="#e2e6ea" stroke-width="0.3"/>
<text x="104.00" y="34.00" font-family="Segoe UI,Arial,Helvetica" font-size="3.0" fill="#15181b" text-anchor="start" font-weight="bold">What the sheet gives</text>
<text x="104.00" y="40.00" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">· Front bedroom 4000 (printed) × 3560 outer → lọt</text>
<text x="104.00" y="44.20" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   lòng ~3900 × 3560 ≈ 13.9 m².</text>
<text x="104.00" y="48.40" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">· Balcony (ban công) 1400 deep at the street, recessed,</text>
<text x="104.00" y="52.60" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   with a 900 door (west) + a 1400 window (east).</text>
<text x="104.00" y="56.80" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">· Together they are the room's daylight — the only</text>
<text x="104.00" y="61.00" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   light source, since both side walls are party walls.</text>
<text x="104.00" y="65.20" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">· Rear band: WC 1950 wide (west) + hall 2010 (east),</text>
<text x="104.00" y="69.40" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   both 1600 deep, both doors opening into the bedroom.</text>
<text x="104.00" y="73.60" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">· Entry comes from that hall, at the rear-EAST: the</text>
<text x="104.00" y="77.80" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   stair core and the lift sit behind it.</text>
<text x="104.00" y="82.00" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">· In the drawing: bed head on the east wall with the</text>
<text x="104.00" y="86.20" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   bedside tables, wardrobe on the WC wall.</text>
<text x="104.00" y="93.40" font-family="Segoe UI,Arial,Helvetica" font-size="3.0" fill="#15181b" text-anchor="start" font-weight="bold">What that means for a split</text>
<text x="104.00" y="99.40" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">· Light lives at the STREET end: any desk wants the</text>
<text x="104.00" y="103.60" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   balcony side (window + door), not the core side.</text>
<text x="104.00" y="107.80" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">· There is only ONE way in, at the rear-east, so a</text>
<text x="104.00" y="112.00" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   front/rear split makes one zone a walk-through —</text>
<text x="104.00" y="116.20" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   whichever zone you do not put the entry in.</text>
<text x="104.00" y="120.40" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">· The WC door is at the rear-west, the entry at the</text>
<text x="104.00" y="124.60" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   rear-east: the middle of the rear wall is the only</text>
<text x="104.00" y="128.80" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   place furniture can stand against it.</text>
<text x="104.00" y="133.00" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">· A side (front-to-rear) split can give each zone its</text>
<text x="104.00" y="137.20" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   own door: the east strip takes the entry, the west</text>
<text x="104.00" y="141.40" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">   strip keeps the balcony door and the WC.</text>
<text x="12.00" y="192.00" font-family="Segoe UI,Arial,Helvetica" font-size="2.3" fill="#5a6167" text-anchor="start" font-weight="normal">This sheet is the base for the four front-room split options; all four keep the balcony, the WC and the entry door where the drawing puts them.</text>
</svg>
