name: Deploy Pages
"on":
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Repo default token is read-only; pushing to gh-pages needs write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy docs to Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
